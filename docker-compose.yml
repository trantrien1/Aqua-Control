version: '3.8'

services:
  aquarium:
    build: .
    container_name: aquarium-server
    restart: unless-stopped
    ports:
      - "3000:3000"   # Dashboard + API
      - "1883:1883"   # MQTT cho ESP32
    environment:
      - PORT=3000
      - MQTT_PORT=1883
      - HOST=0.0.0.0
      # Chỉ dùng lần đầu để tạo tài khoản quản trị `admin`.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-beca123}
      - SESSION_SECRET=${SESSION_SECRET}
      - EMBEDDED_BROKER=true
      - TZ=Asia/Ho_Chi_Minh
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_NOTIFY_LEVEL=${TELEGRAM_NOTIFY_LEVEL:-warn}
      - TELEGRAM_REPEAT_WARN_MINUTES=${TELEGRAM_REPEAT_WARN_MINUTES:-30}
      - TELEGRAM_REPEAT_CRITICAL_MINUTES=${TELEGRAM_REPEAT_CRITICAL_MINUTES:-10}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:3000}
    volumes:
      - aquarium-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Bộ giả lập ESP32 (tuỳ chọn): docker compose --profile demo up
  # Phải cấp thiết bị trên web trước rồi điền DEVICE_ID/DEVICE_KEY vào .env,
  # hoặc chạy `node tools/create-demo-device.mjs` để nhận sẵn hai giá trị đó.
  simulator:
    build: .
    container_name: aquarium-simulator
    depends_on:
      aquarium:
        condition: service_healthy
    environment:
      - MQTT_URL=mqtt://aquarium:1883
      - DEVICE_ID=${DEVICE_ID:-}
      - DEVICE_KEY=${DEVICE_KEY:-}
      - TZ=Asia/Ho_Chi_Minh
    command: node --no-warnings tools/simulate-device.js --url mqtt://aquarium:1883 --interval 5 --scenario relay-test
    profiles: ["demo"]

volumes:
  aquarium-data:
